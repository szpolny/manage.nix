# The flake's checks, split so each job stays small:
#
# - `build`: packages and Rust dependencies, shared through a per-run artifact.
# - `quick`: tests and Clippy, using the shared Rust dependencies.
# - `vm`: NixOS VM tests, one per runner (several at once starve a hosted
#   runner). Pushes and pull requests select tests by changed paths; the
#   weekly run (or a manual one) runs them all. See docs/development.md.
#
# Jobs use the Cachix cache named by the CACHIX_NAME repository
# variable. They pull from it always and push everything they build on
# pushes to main (which include every commit release-please tags), so users
# of a release substitute its packages instead of compiling them. Pushing
# needs the CACHIX_AUTH_TOKEN secret; pull requests never push. Without
# CACHIX_NAME the cache steps are skipped.
#
# GitHub's ubuntu-latest runners expose /dev/kvm, but only to the runner user
# after a udev rule grants access; without KVM the VM tests fall back to
# emulation and are too slow to be useful.
name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize only PR updates. Main runs finish and publish their cache, but
  # must not block checks for newer commits if a runner becomes unresponsive.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.select.outputs.tests }}
      has-tests: ${{ steps.select.outputs.has-tests }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test VM selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - id: select
        name: Select VM tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/select-vm-tests.py

  build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - if: ${{ vars.CACHIX_NAME != '' }}
        uses: cachix/cachix-action@v16
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' }}
      - name: Check formatting, versions, and Darwin modules
        run: |
          nix build -L --no-link \
            .#checks.x86_64-linux.{versions,darwin-local-https,cargo-fmt}
      - name: Build shared dependencies and packages
        run: |
          nix build -L --no-link \
            .#checks.x86_64-linux.{cargo-deps,mnix,mnix-agent,mnix-server,mnix-web}
      - name: Export shared Rust dependencies
        run: |
          nix copy --to "file://$RUNNER_TEMP/nix-deps?compression=zstd" \
            .#checks.x86_64-linux.cargo-deps
      - uses: actions/upload-artifact@v4
        with:
          name: nix-deps
          path: ${{ runner.temp }}/nix-deps
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Export shared packages
        if: needs.changes.outputs.has-tests == 'true'
        run: |
          nix copy --to "file://$RUNNER_TEMP/nix-packages?compression=zstd" \
            .#checks.x86_64-linux.{mnix,mnix-agent,mnix-server,mnix-web}
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.has-tests == 'true'
        with:
          name: nix-packages
          path: ${{ runner.temp }}/nix-packages
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  quick:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - if: ${{ vars.CACHIX_NAME != '' }}
        uses: cachix/cachix-action@v16
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' }}
      - uses: actions/download-artifact@v4
        with:
          name: nix-deps
          path: ${{ runner.temp }}/nix-deps
      - name: Import shared builds
        run: |
          nix copy --from "file://$RUNNER_TEMP/nix-deps" --no-check-sigs \
            .#checks.x86_64-linux.cargo-deps
      - name: Run checks
        run: |
          nix build -L --no-link \
            .#checks.x86_64-linux.{cargo-clippy,cargo-test,store-postgres}

  vm:
    needs: [changes, build]
    if: needs.changes.outputs.has-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.changes.outputs.tests) }}
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm
      - if: ${{ vars.CACHIX_NAME != '' }}
        uses: cachix/cachix-action@v16
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' }}
      - uses: actions/download-artifact@v4
        with:
          name: nix-packages
          path: ${{ runner.temp }}/nix-packages
      - name: Import shared packages
        run: |
          nix copy --from "file://$RUNNER_TEMP/nix-packages" --no-check-sigs \
            .#checks.x86_64-linux.{mnix,mnix-agent,mnix-server,mnix-web}
      - name: Check KVM
        run: test -w /dev/kvm || { echo "::error::/dev/kvm is not available to this job"; exit 1; }
      - run: nix build -L --no-link .#checks.x86_64-linux.${{ matrix.test }}
