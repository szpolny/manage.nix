# The flake's checks, split so each job stays small:
#
# - `quick`: tests, lints, the versions check, and the packages.
# - `vm`: NixOS VM tests, one per runner (several at once starve a hosted
#   runner). Pushes and pull requests select tests by changed paths; the
#   weekly run (or a manual one) runs them all. See docs/development.md.
#
# Both jobs use the Cachix cache named by the CACHIX_NAME repository
# variable. They pull from it always and push everything they build on
# pushes to main (which include every commit release-please tags), so users
# of a release substitute its packages instead of compiling them. Pushing
# needs the CACHIX_AUTH_TOKEN secret; pull requests never push. Without
# CACHIX_NAME the cache steps are skipped.
#
# GitHub's ubuntu-latest runners expose /dev/kvm, but only to the runner user
# after a udev rule grants access; without KVM the VM tests fall back to
# emulation and are too slow to be useful.
name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.select.outputs.tests }}
      has-tests: ${{ steps.select.outputs.has-tests }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: select
        name: Select VM tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/select-vm-tests.py

  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - if: ${{ vars.CACHIX_NAME != '' }}
        uses: cachix/cachix-action@v16
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' }}
      - run: |
          nix build -L --no-link \
            .#checks.x86_64-linux.{versions,cargo-fmt,cargo-clippy,cargo-test,store-postgres} \
            .#checks.x86_64-linux.{mnix,mnix-agent,mnix-server,mnix-web}

  vm:
    needs: changes
    if: needs.changes.outputs.has-tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.changes.outputs.tests) }}
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm
      - if: ${{ vars.CACHIX_NAME != '' }}
        uses: cachix/cachix-action@v16
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' }}
      - name: Check KVM
        run: test -w /dev/kvm || { echo "::error::/dev/kvm is not available to this job"; exit 1; }
      - run: nix build -L --no-link .#checks.x86_64-linux.${{ matrix.test }}
