# Runs every flake check, including the NixOS VM tests.
#
# Requirements for the runner: x86_64-linux with /dev/kvm available to the
# job (for a Docker-based runner, pass `--device /dev/kvm` in the runner's
# container options). Without KVM the VM tests fall back to emulation and are
# too slow to be useful.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://github.com/cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm
      - name: Check KVM
        run: test -w /dev/kvm || { echo "::error::/dev/kvm is not available to this job"; exit 1; }
      - run: nix flake check -L
